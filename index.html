<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayadi Store – Nos réseaux</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;
    background:radial-gradient(120% 80% at 50% 0%,#0e1a52 0%,#030630 65%);display:flex;justify-content:center;padding:40px 20px}
  main{width:100%;max-width:420px;text-align:center}
  .logo{display:block;width:150px;height:auto;margin:0 auto 22px}
  h1{font-size:24px;font-weight:700}
  .sub{margin:6px 0 28px;color:#b8c0d9;font-size:14px;line-height:1.5}
  a.btn{display:flex;align-items:center;gap:14px;padding:16px 18px;margin-bottom:12px;border-radius:16px;
    text-decoration:none;color:#fff;font-weight:600;font-size:16px;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);transition:transform .15s,background .15s}
  a.btn:active,a.btn:hover{transform:scale(1.02);background:rgba(255,255,255,.14)}
  a.btn svg{width:28px;height:28px;flex:none}
  a.btn span{flex:1;text-align:left}
  a.btn i{font-style:normal;opacity:.5}
  .fb svg{color:#4c8bf5}.ig svg{color:#ff5fa2}.tt svg{color:#25f4ee}.web svg{color:#fff}
  footer{margin-top:28px;font-size:12px;color:#8a93b0;line-height:1.6}
</style>
</head>
<body>
<main>
  <svg class="logo" role="img" aria-label="Sayadi Store" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 53.8 23.78"><path fill="#fff" d="M53.65.86l-6,6a.51.51,0,0,1-.36.15H29.88L23,13.84a.54.54,0,0,1-.36.14H14.22a.5.5,0,0,1-.36-.86L20,7,26.83.15A.51.51,0,0,1,27.19,0h26.1A.5.5,0,0,1,53.65.86Z"/><path fill="#fff" d="M.15,22.92l6-6a.48.48,0,0,1,.36-.15H23.92l6.84-6.85a.52.52,0,0,1,.36-.14h8.46a.5.5,0,0,1,.35.86l-6.12,6.13L27,23.63a.48.48,0,0,1-.36.15H.51A.5.5,0,0,1,.15,22.92Z"/></svg>
  <h1>Sayadi Store</h1>
  <p class="sub">Électronique depuis 1998 · Passage, Tunis<br>Commande en ligne, paiement à la livraison</p>

  <a class="btn web" href="https://sayadistore.tn" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
    <span>Notre boutique en ligne</span><i>›</i></a>

  <a class="btn fb" href="https://www.facebook.com/share/1KJL4NqmAe/" rel="noopener">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 22v-8.2h2.8l.5-3.3h-3.3V8.4c0-.9.4-1.7 1.8-1.7h1.6V3.8S15.600 3.5 14.300 3.5c-2.700 0-4.400 1.600-4.400 4.500v2.500H7.100v3.300h2.800V22h3.600z"/></svg>
    <span>Facebook</span><i>›</i></a>

  <a class="btn ig" href="https://www.instagram.com/sayadistore2025" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.500" cy="6.500" r="1" fill="currentColor"/></svg>
    <span>Instagram</span><i>›</i></a>

  <a class="btn tt" href="https://www.tiktok.com/@sayadistore" rel="noopener">

    <span>TikTok</span><i>›</i></a>

  <footer>Scannez, cliquez, suivez-nous 🙌</footer>
</main>
</body>
</html>
